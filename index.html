<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#100d1c" name="theme-color"/>
<title>Birthday Quest ♡ — Mr Kwok Hin Lo</title>
<style>
    :root {
      --bg: #100d1c;
      --panel: #191428;
      --purple: #b79aff;
      --light: #e8ddff;
      --muted: #b7afc8;
      --border: #45365f;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 0%, #33214f 0%, transparent 48%),
        var(--bg);
      color: #f8f5ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", sans-serif;
      min-height: 100vh;
      line-height: 1.75;
    }

    button { font: inherit; }

    .wrap {
      width: min(100% - 32px, 650px);
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1.5px;
      margin-bottom: 36px;
    }

    .logo { color: var(--purple); font-weight: 800; }

    .music-btn {
      background: transparent;
      color: var(--light);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .screen { display: none; animation: appear .45s ease; }
    .screen.active { display: block; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      color: var(--purple);
      letter-spacing: 3px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(30px, 8vw, 48px);
      line-height: 1.2;
      letter-spacing: -1px;
      margin: 16px 0;
    }

    h2 {
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.35;
      margin: 12px 0;
    }

    h3 { line-height: 1.4; }

    .purple { color: var(--purple); }
    .muted { color: var(--muted); }
    .center { text-align: center; }

    .hero {
      min-height: 62vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .symbol {
      font-size: 46px;
      color: var(--purple);
      margin-bottom: 16px;
      filter: drop-shadow(0 0 20px #9670ff80);
    }

    .panel {
      background: linear-gradient(145deg, #201831, #171222);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: clamp(20px, 5vw, 30px);
      margin: 20px 0;
      box-shadow: 0 12px 40px #00000025;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #211a31;
      color: #f8f5ff;
      text-align: left;
      cursor: pointer;
      margin-top: 11px;
      min-height: 52px;
      transition: background .2s, border-color .2s, transform .2s;
      overflow-wrap: anywhere;
    }

    .btn:hover, .btn:focus-visible {
      border-color: var(--purple);
      background: #302343;
      outline: none;
    }

    .btn:active { transform: scale(.985); }

    .btn.primary {
      background: var(--purple);
      color: #171023;
      border-color: var(--purple);
      text-align: center;
      font-weight: 800;
    }

    .btn.primary:hover { background: #d0bcff; }

    .btn.option.selected {
      border-color: var(--purple);
      background: #38264e;
    }

    .progress {
      height: 5px;
      background: #30273e;
      border-radius: 10px;
      overflow: hidden;
      margin: 16px 0 24px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--purple);
      transition: width .3s;
    }

    .question-number {
      color: var(--purple);
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .feedback {
      min-height: 30px;
      margin-top: 14px;
      color: var(--light);
      font-size: 14px;
    }

    .chapter { margin-top: 28px; }

    .chapter-label {
      color: var(--purple);
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .photo-placeholder {
      min-height: 210px;
      border: 1px dashed #79669c;
      border-radius: 16px;
      background:
        radial-gradient(ellipse at center, #42305f 0%, #201831 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--light);
      text-align: center;
      padding: 20px;
      margin: 16px 0;
    }

    .photo-placeholder .camera { font-size: 34px; }

    .memory-photo {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: cover;
      border-radius: 16px;
      margin: 16px 0;
    }

    .memory-text {
      color: #e3dbea;
      white-space: pre-line;
    }

    .divider {
      border: 0;
      border-top: 1px solid #3b2e50;
      margin: 28px 0;
    }

    .tiny {
      font-size: 12px;
      color: var(--muted);
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      margin-top: 48px;
      color: #9387a9;
      font-size: 12px;
    }
